name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Baixar dependências
        run: go mod download

      - name: Testes
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Race detector
        run: go test -race ./...

  security:
    name: Verificação de vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Instalar govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Rodar govulncheck
        run: govulncheck ./...
